<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 374" width="900" role="img" aria-label="4G lab: what changed after hardening" font-family="Helvetica, Arial, sans-serif"><title>4G lab: what changed after hardening</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1f2933"/></marker></defs><rect width="900" height="374" fill="#ffffff"/><text x="450" y="30" font-size="17" font-weight="700" fill="#1f2933" text-anchor="middle" >4G lab: what changed after hardening</text><text x="40" y="58" font-size="12" font-weight="700" fill="#52606d" text-anchor="start" >Question</text><text x="380" y="58" font-size="12" font-weight="700" fill="#b42318" text-anchor="start" >Default configuration (baseline)</text><text x="640" y="58" font-size="12" font-weight="700" fill="#1a7f4b" text-anchor="start" >Hardened</text><rect x="30" y="68" width="840" height="38" rx="6" fill="#fff" stroke="#d9dee3" stroke-width="1"/><text x="40" y="91" font-size="12.5" font-weight="600" fill="#1f2933" text-anchor="start" >NAS ciphering selected by the MME</text><text x="380" y="91" font-size="12" font-weight="400" fill="#b42318" text-anchor="start" >EEA0 (no encryption)</text><text x="640" y="91" font-size="12" font-weight="400" fill="#1a7f4b" text-anchor="start" >EEA2</text><rect x="30" y="112" width="840" height="38" rx="6" fill="#fff" stroke="#d9dee3" stroke-width="1"/><text x="40" y="135" font-size="12.5" font-weight="600" fill="#1f2933" text-anchor="start" >S6a Diameter in the capture</text><text x="380" y="135" font-size="12" font-weight="400" fill="#b42318" text-anchor="start" >6 readable frames incl. RAND, K_ASME</text><text x="640" y="135" font-size="12" font-weight="400" fill="#1a7f4b" text-anchor="start" >0 readable, 6 TLS records</text><rect x="30" y="156" width="840" height="38" rx="6" fill="#fff" stroke="#d9dee3" stroke-width="1"/><text x="40" y="179" font-size="12.5" font-weight="600" fill="#1f2933" text-anchor="start" >Unauthorised eNB</text><text x="380" y="179" font-size="12" font-weight="400" fill="#b42318" text-anchor="start" >Accepted as eNB number 2</text><text x="640" y="179" font-size="12" font-weight="400" fill="#1a7f4b" text-anchor="start" >MME never sees it</text><rect x="30" y="200" width="840" height="38" rx="6" fill="#fff" stroke="#d9dee3" stroke-width="1"/><text x="40" y="223" font-size="12.5" font-weight="600" fill="#1f2933" text-anchor="start" >UE reaching the core</text><text x="380" y="223" font-size="12" font-weight="400" fill="#b42318" text-anchor="start" >Pings MME, HSS, UPF; MongoDB port open</text><text x="640" y="223" font-size="12" font-weight="400" fill="#1a7f4b" text-anchor="start" >All blocked</text><text x="40" y="262" font-size="12" font-weight="700" fill="#b54708" text-anchor="start" >Not fixed by configuration (stated openly in the repository)</text><rect x="30" y="272" width="840" height="26" rx="6" fill="#fffaf0" stroke="#f0d9b5" stroke-width="1"/><text x="40" y="289" font-size="12" font-weight="600" fill="#1f2933" text-anchor="start" >Subscriber identity (IMSI) in the Attach Request</text><text x="380" y="289" font-size="12" font-weight="400" fill="#b54708" text-anchor="start" >Readable: 4G has no SUCI, 5G added it</text><rect x="30" y="302" width="840" height="26" rx="6" fill="#fffaf0" stroke="#f0d9b5" stroke-width="1"/><text x="40" y="319" font-size="12" font-weight="600" fill="#1f2933" text-anchor="start" >GTP (S11, S1-U, S5-U)</text><text x="380" y="319" font-size="12" font-weight="400" fill="#b54708" text-anchor="start" >IMSI and user traffic readable: needs IPsec</text><text x="40" y="364" font-size="10.5" font-weight="400" fill="#52606d" text-anchor="start" >Measured with tshark on the captures in this repository. Single runs on a laptop.</text></svg>