logger:
  path:
    file: /opt/open5gs/var/log/open5gs/mme.log
global: null
mme:
  freeDiameter: /opt/open5gs/etc/freeDiameter/mme.conf
  s1ap:
    server:
    - address: 10.20.2.11
  gtpc:
    server:
    - address: 10.20.1.11
    client:
      sgwc:
      - address: 10.20.1.12
        tac: 1
      smf:
      - address: 10.20.1.13
        tac: 1
  metrics:
    server:
    - port: 9090
      address: 10.20.1.11
  gummei:
  - plmn_id:
      mcc: 999
      mnc: 70
    mme_gid: 2
    mme_code: 1
  tai:
  - plmn_id:
      mcc: 999
      mnc: 70
    tac: 1
  security:
    integrity_order:
    - EIA2
    - EIA1
    - EIA0
    ciphering_order:
    - EEA0
    - EEA1
    - EEA2
  network_name:
    full: Open5GS
    short: Next
  mme_name: open5gs-mme0
  time: null
